[project]
name = "hexam"
version = "0.1.0"
description = "Georgia Tech final exam schedule optimization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "tzdata>=2024.1", # IANA zones for zoneinfo on Windows
    "ortools>=9.12", # CP-SAT solver
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
data = ["pypdf>=5"] # final exam matrix / IRP Fact Book PDF parsing (hexam.data_generation)
dev = ["pytest>=8", "pypdf>=5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hexam*"]

[tool.setuptools.package-data]
"hexam.data_generation" = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
